<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Terraria 2D</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #555;
            background: #87CEEB;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            touch-action: none;
        }
        .ui-container {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            background: #222;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .slot {
            width: 45px;
            height: 40px;
            background: #333;
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border-radius: 5px;
        }
        .slot span {
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
        }
        .controls {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            font-size: 14px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }
        button:active {
            background: #666;
        }
        .btn-action {
            background: #2e7d32;
        }
        .btn-action:active {
            background: #1b5e20;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="380"></canvas>

    <div class="ui-container">
        <div class="slot">🪵 Kayu <span id="inv-wood">0</span></div>
        <div class="slot">🪨 Batu <span id="inv-stone">0</span></div>
        <div class="slot">🟫 Tanah <span id="inv-dirt">0</span></div>
    </div>

    <div class="controls">
        <button id="btn-left">◀ Kiri</button>
        <button id="btn-jump">Loncat 🦘</button>
        <button id="btn-chop" class="btn-action">Tebang 🪵</button>
        <button id="btn-dig" class="btn-action">Gali ⛏️</button>
        <button id="btn-right">Kanan ▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const tileSize = 30;
        const mapWidth = 60; 
        const mapHeight = 14;
        
        let world = [];
        for (let y = 0; y < mapHeight; y++) {
            let row = [];
            for (let x = 0; x < mapWidth; x++) {
                if (y < 3) row.push(0); // Udara atas
                else if (y === 3 || y === 4) {
                    // Pohon tinggi (Batang di y=3 & y=4, Daun di atasnya)
                    if (x % 9 === 0 && x > 4 && x < mapWidth - 4) row.push(3); // Batang Kayu
                    else row.push(0);
                }
                else if (y === 5) {
                    // Daun Pohon di puncak atau tanah
                    if (x % 9 === 0 && x > 4 && x < mapWidth - 4) row.push(4); // Daun Pohon
                    else row.push(1); // Tanah atas
                }
                else if (y < 10) row.push(1); // Tanah bawah
                else row.push(2); // Batu
            }
            world.push(row);
        }

        let player = {
            x: 100,
            y: 90,
            width: 26,
            height: 38,
            vx: 0,
            vy: 0,
            speed: 3,
            direction: 1, // 1 ke kanan, -1 ke kiri
            isGrounded: false
        };

        let inventory = { wood: 0, stone: 0, dirt: 0 };
        let keys = { left: false, right: false };

        // Kontrol Tombol Sentuh / Tahan
        document.getElementById("btn-left").addEventListener("pointerdown", () => keys.left = true);
        document.getElementById("btn-left").addEventListener("pointerup", () => keys.left = false);
        document.getElementById("btn-left").addEventListener("pointerleave", () => keys.left = false);

        document.getElementById("btn-right").addEventListener("pointerdown", () => keys.right = true);
        document.getElementById("btn-right").addEventListener("pointerup", () => keys.right = false);
        document.getElementById("btn-right").addEventListener("pointerleave", () => keys.right = false);

        document.getElementById("btn-jump").addEventListener("click", () => {
            if (player.isGrounded) {
                player.vy = -9;
                player.isGrounded = false;
            }
        });

        // Tombol TEBANG (Menebang batang/daun pohon di depan karakter)
        document.getElementById("btn-chop").addEventListener("click", () => {
            let pCol = Math.floor((player.x + player.width / 2) / tileSize);
            let pRow = Math.floor((player.y + player.height / 2) / tileSize);
            let targetCol = pCol + player.direction; // Cek blok di depan arah hadap pemain

            // Cek beberapa baris di depan
            let checkRows = [pRow, pRow - 1, pRow + 1];
            for (let r of checkRows) {
                if (r >= 0 && r < mapHeight && targetCol >= 0 && targetCol < mapWidth) {
                    let blockType = world[r][targetCol];
                    if (blockType === 3 || blockType === 4) { // Jika ketemu pohon/daun
                        inventory.wood++;
                        world[r][targetCol] = 0;
                        updateInventoryUI();
                        break;
                    }
                }
            }
        });

        // Tombol GALI (Menggali tanah atau batu di bawah kaki karakter)
        document.getElementById("btn-dig").addEventListener("click", () => {
            let pCol = Math.floor((player.x + player.width / 2) / tileSize);
            let groundRow = Math.floor((player.y + player.height + 2) / tileSize); // Tepat di bawah kaki

            if (groundRow >= 0 && groundRow < mapHeight && pCol >= 0 && pCol < mapWidth) {
                let blockType = world[groundRow][pCol];
                if (blockType === 1) { // Tanah
                    inventory.dirt++;
                    world[groundRow][pCol] = 0;
                    updateInventoryUI();
                } else if (blockType === 2) { // Batu
                    inventory.stone++;
                    world[groundRow][pCol] = 0;
                    updateInventoryUI();
                }
            }
        });

        function updateInventoryUI() {
            document.getElementById("inv-wood").innerText = inventory.wood;
            document.getElementById("inv-stone").innerText = inventory.stone;
            document.getElementById("inv-dirt").innerText = inventory.dirt;
        }

        function update() {
            player.vx = 0;
            if (keys.left) {
                player.vx = -player.speed;
                player.direction = -1;
            }
            if (keys.right) {
                player.vx = player.speed;
                player.direction = 1;
            }

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x > mapWidth * tileSize - player.width) player.x = mapWidth * tileSize - player.width;

            // Gravitasi
            player.vy += 0.4;
            player.y += player.vy;
            player.isGrounded = false;

            let leftCol = Math.floor(player.x / tileSize);
            let rightCol = Math.floor((player.x + player.width) / tileSize);
            let bottomRow = Math.floor((player.y + player.height) / tileSize);

            if (bottomRow >= 0 && bottomRow < mapHeight) {
                if ((world[bottomRow][leftCol] > 0 && world[bottomRow][leftCol] < 3) || 
                    (world[bottomRow][rightCol] > 0 && world[bottomRow][rightCol] < 3)) {
                    player.y = bottomRow * tileSize - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let cameraX = player.x - canvas.width / 2 + player.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > mapWidth * tileSize - canvas.width) cameraX = mapWidth * tileSize - canvas.width;

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Gambar Dunia Blok
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    let type = world[y][x];
                    if (type === 1) {
                        ctx.fillStyle = "#8B4513"; // Tanah
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = "#5C3317";
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else if (type === 2) {
                        ctx.fillStyle = "#708090"; // Batu
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else if (type === 3) {
                        ctx.fillStyle = "#5D4037"; // Batang Pohon Coklat Tua
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else if (type === 4) {
                        ctx.fillStyle = "#228B22"; // Daun Pohon Hijau
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    }
                }
            }

            // Gambar Karakter Klasik (Kotak Merah dengan Mata Putih)
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "white";
            let eyeX = player.direction === 1 ? player.x + 16 : player.x + 4;
            ctx.fillRect(eyeX, player.y + 8, 6, 6);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
