<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Terraria 2D</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #555;
            background: #87CEEB;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            touch-action: none;
        }
        .ui-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            background: #222;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .slot {
            width: 45px;
            height: 45px;
            background: #333;
            border: 2px solid #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border-radius: 5px;
        }
        .slot span {
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }
        button:active {
            background: #666;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="ui-container">
        <div class="slot">🪵 Kayu <span id="inv-wood">0</span></div>
        <div class="slot">🪨 Batu <span id="inv-stone">0</span></div>
        <div class="slot">🟫 Tanah <span id="inv-dirt">0</span></div>
    </div>

    <div class="controls">
        <button id="btn-left">◀ Kiri</button>
        <button id="btn-jump">Loncat 🦘</button>
        <button id="btn-action">Tebang/Gali ⛏️</button>
        <button id="btn-right">Kanan ▶</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const tileSize = 30;
        const mapWidth = 60; 
        const mapHeight = 15;
        
        let world = [];
        for (let y = 0; y < mapHeight; y++) {
            let row = [];
            for (let x = 0; x < mapWidth; x++) {
                if (y < 4) row.push(0); // Udara
                else if (y === 4) {
                    if (x % 8 === 0 && x > 5 && x < mapWidth - 5) row.push(3); // Batang Pohon
                    else row.push(0);
                }
                else if (y === 5) row.push(1); // Tanah atas
                else if (y < 10) row.push(1); // Tanah bawah
                else row.push(2); // Batu
            }
            world.push(row);
        }

        let player = {
            x: 100,
            y: 90,
            width: 30,  // Ukuran dikembalikan seperti semula
            height: 40,
            vx: 0,
            vy: 0,
            speed: 3,
            isGrounded: false
        };

        let inventory = { wood: 0, stone: 0, dirt: 0 };
        let keys = { left: false, right: false };

        document.getElementById("btn-left").addEventListener("pointerdown", () => keys.left = true);
        document.getElementById("btn-left").addEventListener("pointerup", () => keys.left = false);
        document.getElementById("btn-left").addEventListener("pointerleave", () => keys.left = false);

        document.getElementById("btn-right").addEventListener("pointerdown", () => keys.right = true);
        document.getElementById("btn-right").addEventListener("pointerup", () => keys.right = false);
        document.getElementById("btn-right").addEventListener("pointerleave", () => keys.right = false);

        document.getElementById("btn-jump").addEventListener("click", () => {
            if (player.isGrounded) {
                player.vy = -9;
                player.isGrounded = false;
            }
        });

        document.getElementById("btn-action").addEventListener("click", () => {
            let pCol = Math.floor((player.x + player.width / 2) / tileSize);
            let pRow = Math.floor((player.y + player.height) / tileSize);

            let targets = [
                {r: pRow, c: pCol},
                {r: pRow + 1, c: pCol},
                {r: pRow, c: pCol + 1},
                {r: pRow, c: pCol - 1},
                {r: pRow - 1, c: pCol}
            ];

            for (let t of targets) {
                if (t.r >= 0 && t.r < mapHeight && t.c >= 0 && t.c < mapWidth) {
                    let blockType = world[t.r][t.c];
                    if (blockType > 0) {
                        if (blockType === 3) inventory.wood++;
                        else if (blockType === 2) inventory.stone++;
                        else if (blockType === 1) inventory.dirt++;

                        world[t.r][t.c] = 0;
                        updateInventoryUI();
                        break;
                    }
                }
            }
        });

        function updateInventoryUI() {
            document.getElementById("inv-wood").innerText = inventory.wood;
            document.getElementById("inv-stone").innerText = inventory.stone;
            document.getElementById("inv-dirt").innerText = inventory.dirt;
        }

        function update() {
            player.vx = 0;
            if (keys.left) player.vx = -player.speed;
            if (keys.right) player.vx = player.speed;

            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x > mapWidth * tileSize - player.width) player.x = mapWidth * tileSize - player.width;

            player.vy += 0.4;
            player.y += player.vy;
            player.isGrounded = false;

            let leftCol = Math.floor(player.x / tileSize);
            let rightCol = Math.floor((player.x + player.width) / tileSize);
            let bottomRow = Math.floor((player.y + player.height) / tileSize);

            if (bottomRow >= 0 && bottomRow < mapHeight) {
                if ((world[bottomRow][leftCol] > 0) || (world[bottomRow][rightCol] > 0)) {
                    player.y = bottomRow * tileSize - player.height;
                    player.vy = 0;
                    player.isGrounded = true;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let cameraX = player.x - canvas.width / 2 + player.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > mapWidth * tileSize - canvas.width) cameraX = mapWidth * tileSize - canvas.width;

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Gambar Dunia
            for (let y = 0; y < mapHeight; y++) {
                for (let x = 0; x < mapWidth; x++) {
                    let type = world[y][x];
                    if (type === 1) {
                        ctx.fillStyle = "#8B4513";
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = "#5C3317";
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else if (type === 2) {
                        ctx.fillStyle = "#708090";
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = "#4f5d69";
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    } else if (type === 3) {
                        ctx.fillStyle = "#228B22";
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                        ctx.strokeStyle = "#006400";
                        ctx.strokeRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    }
                }
            }

            // Gambar Karakter Gaya Semula (Kotak Merah dengan Mata Putih)
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "white";
            ctx.fillRect(player.x + 18, player.y + 8, 6, 6);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
